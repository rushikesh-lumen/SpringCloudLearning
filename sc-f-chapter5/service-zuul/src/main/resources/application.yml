eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8769
spring:
  application:
    name: service-zuul
  cloud:
    gateway:
      routes: # MIGRATED: replaced zuul.routes with spring.cloud.gateway.routes
        - id: api-a # MIGRATED: converted from Zuul route to Spring Cloud Gateway route
          uri: lb://service-ribbon # MIGRATED: lb:// prefix for load-balanced service calls
          predicates:
            - Path=/api-a/**
        - id: api-b # MIGRATED: converted from Zuul route to Spring Cloud Gateway route
          uri: lb://service-feign # MIGRATED: lb:// prefix for load-balanced service calls
          predicates:
            - Path=/api-b/**
