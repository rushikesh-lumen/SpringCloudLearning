
server:
  port: 5000

spring:
  application:
    name: gateway

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: provider
          uri: lb://provider
          predicates:
            - Path=/provider/**
          filters:
            - StripPrefix=1
        - id: consumer
          uri: lb://consumer
          predicates:
            - Path=/consumer/**
          filters:
            - StripPrefix=1
    sentinel:
      transport:
        port: 15000
        dashboard: localhost:8748


  main:
    allow-bean-definition-overriding: true

# MIGRATED: spring.zipkin.sender.type removed in Spring Boot 3.x (always HTTP)
# spring.zipkin.sender.type: web
#设置采样率默认为 0.1 注意之前的版本是percentage 新版本中更换为 probability
management.tracing.sampling.probability: 1 # MIGRATED: spring.sleuth.sampler.probability → management.tracing.sampling.probability
management.zipkin.tracing.endpoint: http://localhost:9411/api/v2/spans # MIGRATED: spring.zipkin.base-url → management.zipkin.tracing.endpoint
# MIGRATED: spring.zipkin.service.name removed; use spring.application.name instead