eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 5000
spring:
  application:
    name: gateway-service
  sleuth: # MIGRATED: updated sleuth config
    sampler:
      probability: 1.0 # MIGRATED: renamed from percentage to probability (Spring Cloud Sleuth 3.x)
  zipkin:
    base-url: http://localhost:9411
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    gateway:
      routes: # MIGRATED: replaced zuul.routes with spring.cloud.gateway.routes
        - id: api-a # MIGRATED: converted from Zuul route to Spring Cloud Gateway route
          uri: lb://user-service # MIGRATED: lb:// prefix for load-balanced service calls
          predicates:
            - Path=/user-api/**
